- name: Parse and Compile Registry
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");
        const input = fs.readFileSync("tabs/projects.txt", "utf8");
        
        const projects = input.split("\n")
          .filter(l => l.includes("||"))
          .map(line => {
            const [link, title, language, description] = line.split("||").map(p => p.trim());
            return { link, title, language, description };
          });
          
        fs.mkdirSync("project", { recursive: true });
        fs.writeFileSync("project/projects.json", JSON.stringify(projects, null, 2));
        '

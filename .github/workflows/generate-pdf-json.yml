name: Generate PDFs Index JSON

on:
  push:
    paths:
      - 'pdf/**' # Triggers only when changes occur inside the pdf folder

permissions:
  contents: write # Allows the action to commit the generated json back to your repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches history so we can grab precise file creation dates

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate pdfs.json
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');
        const { execSync } = require('child_process');

        // Dynamically find the correct folder path regardless of runtime environment
        const pdfDir = path.resolve('pdf');
        const outputFile = path.join(pdfDir, 'pdfs.json');

        console.log('Targeting Directory:', pdfDir);

        if (!fs.existsSync(pdfDir)) {
          console.error('ERROR: The pdf directory was not found at:', pdfDir);
          process.exit(1);
        }

        // Read files and filter strictly for files ending in .pdf
        const files = fs.readdirSync(pdfDir).filter(file => file.toLowerCase().endsWith('.pdf'));
        console.log('Found PDF Files:', files);
        
        const pdfArray = files.map(file => {
          const filePath = path.join(pdfDir, file);
          let dateStr = '2026-06-15'; // Accurate runtime calendar fallback
          
          try {
            const gitDate = execSync(\`git log -1 --format=%as -- \"\${filePath}\"\`).toString().trim();
            if (gitDate) dateStr = gitDate;
          } catch (e) {
            const stat = fs.statSync(filePath);
            dateStr = stat.birthtime.toISOString().split('T')[0];
          }

          return {
            title: file.replace(/_/g, ' ').replace('.pdf', ''), // Formats file name beautifully for display
            filename: file,
            date: dateStr
          };
        });

        // Sort items by date descending (Newest first)
        pdfArray.sort((a, b) => b.date.localeCompare(a.date));

        fs.writeFileSync(outputFile, JSON.stringify(pdfArray, null, 2));
        console.log(\`Successfully compiled index map with \${pdfArray.length} assets.\`);
        "

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Pull latest modifications to prevent state desync collisions
        git pull origin main

        git add pdf/pdfs.json
        
        if git diff --staged --quiet; then
          echo "No structural layout adjustments detected. Skipping deployment cycle."
        else
          git commit -m "sys(automation): dynamically updated structural pdf mappings [skip ci]"
          git push origin main
        fi

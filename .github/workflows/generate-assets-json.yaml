name: Consolidated Site Asset Indexer

on:
  push:
    branches:
      - main
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # We use Node.js to run an inline script to index your folders
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Asset JSONs
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          // 1. Helper to read line-by-line .txt files to array
          function parseTxtFile(filePath) {
            if (!fs.existsSync(filePath)) return [];
            return fs.readFileSync(filePath, 'utf-8')
              .split('\n')
              .map(line => line.trim())
              .filter(line => line.length > 0);
          }

          // 2. Helper to get all files in a directory (filtered by extension)
          function getFolderFiles(dirPath, extFilter = '') {
            if (!fs.existsSync(dirPath)) return [];
            return fs.readdirSync(dirPath)
              .filter(file => fs.statSync(path.join(dirPath, file)).isFile() && file.endsWith(extFilter));
          }

          // --- Process Tabs Folder ---
          console.log('Indexing tabs...');
          const videos = parseTxtFile('tabs/videos.txt');
          const plugins = parseTxtFile('tabs/plugins.txt');
          const projects = parseTxtFile('tabs/projects.txt');

          fs.writeFileSync('tabs/videos.json', JSON.stringify(videos, null, 2));
          fs.writeFileSync('tabs/plugins.json', JSON.stringify(plugins, null, 2));
          fs.writeFileSync('tabs/projects.json', JSON.stringify(projects, null, 2));

          // --- Process Blog Folder ---
          console.log('Indexing blog...');
          const blogs = getFolderFiles('blog', '.html');
          fs.writeFileSync('blog/blogs.json', JSON.stringify(blogs, null, 2));

          // --- Process PDF Folder ---
          console.log('Indexing PDFs...');
          const pdfs = getFolderFiles('pdf');
          fs.writeFileSync('blog/pdfs.json', JSON.stringify(pdfs, null, 2));

          console.log('Indexing complete!');
          "

      # Commit the newly generated JSON files back into the repo
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add files safely even if some don't exist yet
          git add tabs/*.json blog/*.json || true

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "sys(automation): regenerate asset indexes [skip ci]"
            git push
          fi

name: Consolidated Site Asset Indexer

on:
  push:
    branches:
      - main

  schedule:
    # Every day at 00:00 UTC
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asset-indexer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found. Skipping install."
          fi

      - name: Generate Asset Indexes
        run: |
          echo "Generating indexes..."

          # Replace with your actual indexing script
          node scripts/generate-indexes.js

      - name: Verify Generated Files
        run: |
          ls -lah tabs || true
          ls -lah blog || true

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            tabs/videos.json \
            tabs/plugins.json \
            tabs/projects.json \
            blog/blogs.json \
            blog/pdfs.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "sys(automation): regenerate asset indexes [skip ci]"
          git push

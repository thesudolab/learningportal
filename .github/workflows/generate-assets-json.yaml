name: Consolidated Site Asset Indexer

on:
  push:
    paths:
      - 'blog/**/*.html'
      - 'pdf/**'
      - 'tabs/videos.txt'
      - 'tabs/plugins.txt'
      - 'tabs/projects.txt'

  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Your existing Node.js indexing script goes here
      # (the script that generates:)
      # tabs/videos.json
      # tabs/plugins.json
      # tabs/projects.json
      # blog/blogs.json
      # blog/pdfs.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            tabs/videos.json \
            tabs/plugins.json \
            tabs/projects.json \
            blog/blogs.json \
            blog/pdfs.json

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "sys(automation): regenerate asset indexes [skip ci]"
            git push
          fi
